<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FuzzyCAD Decision</title>
<style>
:root{--navy:#21313f;--line:#e2e5ea;--muted:#7b8794;--orange:#e17e26;--bg:#fff;--green:#2ea043}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy)}
.card{margin:10px;padding:13px;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:10px;background:var(--bg);box-shadow:0 8px 24px rgba(20,31,43,.12)}
.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;margin-bottom:5px}
.title{font-size:15px;font-weight:760;line-height:1.25;margin-bottom:10px}
.options{display:flex;gap:7px}.choice{flex:1;min-width:110px;border:1px solid var(--line);border-radius:8px;padding:10px 8px;background:#fff;color:var(--navy);font-size:12px;font-weight:700;cursor:pointer}.choice:hover{border-color:var(--navy)}.choice.selected{border-color:var(--orange);background:#fff7ef;color:#a8540c;box-shadow:inset 0 0 0 1px var(--orange)}
.confirm{width:100%;margin-top:9px;padding:8px 10px;border:1px solid var(--green);border-radius:8px;background:var(--green);color:#fff;font-size:11.5px;font-weight:750;cursor:pointer}.confirm:hover{filter:brightness(.96)}.confirm:disabled{background:#d8dde2;border-color:#d8dde2;color:#8b949e;cursor:default;filter:none}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">FuzzyCAD · Need Input</div>
  <div id="title" class="title">Waiting…</div>
  <div id="options" class="options"></div>
  <button id="confirm" class="confirm" disabled>Confirm</button>
</div>
<script>
(function(){
  "use strict";
  var current={kind:null,options:[]};
  var draft=null;
  var receivedPrompt=false;
  var readyTries=0;

  function send(action,data){
    if(window.adsk&&typeof window.adsk.fusionSendData==="function"){
      return window.adsk.fusionSendData(action,JSON.stringify(data||{}));
    }
    return Promise.resolve("{}");
  }

  function titleFor(data){
    if(data.kind==="move_scope") return "Want to move together?";
    if(data.kind==="scale_scope") return "Scale from which side?";
    return "Choose";
  }

  function labelFor(data,opt){
    if(data.kind==="move_scope"){
      if(opt.value==="together") return "Together";
      if(opt.value==="only") return "Separate";
    }
    if(data.kind==="scale_scope"){
      if(opt.value==="positive") return "+ side";
      if(opt.value==="negative") return "- side";
      if(opt.value==="both") return "Both sides";
    }
    return opt.label||opt.value;
  }

  function paint(){
    var buttons=document.querySelectorAll(".choice");
    Array.prototype.forEach.call(buttons,function(b){
      b.classList.toggle("selected",b.getAttribute("data-value")===draft);
    });
    document.getElementById("confirm").disabled=!draft;
  }

  function render(data){
    current=data||{};
    receivedPrompt=!!current.kind;
    draft=null;
    document.getElementById("title").textContent=titleFor(current);
    var wrap=document.getElementById("options");wrap.innerHTML="";
    (current.options||[]).forEach(function(opt){
      var b=document.createElement("button");
      b.className="choice";
      b.setAttribute("data-value",opt.value);
      b.textContent=labelFor(current,opt);
      b.addEventListener("click",function(){draft=opt.value;paint();});
      wrap.appendChild(b);
    });
    document.getElementById("confirm").textContent="Confirm";
    paint();
  }

  document.getElementById("confirm").addEventListener("click",function(){
    if(!draft||!current.kind)return;
    this.disabled=true;
    send("confirm",{kind:current.kind,value:draft});
  });

  window.fusionJavaScriptHandler={handle:function(action,dataString){
    try{
      var data=dataString?JSON.parse(dataString):{};
      if(action==="prompt")render(data);
    }catch(e){return JSON.stringify({ok:false,error:String(e)});}
    return JSON.stringify({ok:true});
  }};

  document.addEventListener("DOMContentLoaded",function(){
    function askForState(){
      if(receivedPrompt||readyTries>=12)return;
      readyTries+=1;
      send("ready",{});
      setTimeout(askForState,180);
    }
    askForState();
  });
})();
</script>
</body>
</html>
