<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FuzzyCAD</title>
  <link rel="stylesheet" href="palette.css" />
</head>
<body>
  <header class="head">
    <div class="head__row">
      <div>
        <div class="brand">FuzzyCAD</div>
        <div class="sub">open questions · fill in · discuss · apply</div>
      </div>
      <label class="switch" title="Continuous direct editing: after each edit the Transform tool re-arms so you can grab the next object. Press Esc on an empty pick to stop.">
        <input id="easy" type="checkbox" />
        <span class="switch__track"><span class="switch__knob"></span></span>
        <span class="switch__label">Easy mode</span>
      </label>
    </div>
  </header>

  <section class="list">
    <div class="list__head"><span id="count" class="chip">0 open · 0 total</span></div>
    <ul id="marks" class="marks"></ul>
    <p id="empty" class="empty">
      No open questions yet.<br />
      Pick a tool from the bottom bar, select geometry, and drag on the model to
      propose a fuzzy operation.
    </p>
  </section>

  <script src="palette.js"></script>
</body>
</html>
