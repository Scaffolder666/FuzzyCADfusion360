<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FuzzyCAD</title>
  <link rel="stylesheet" href="palette.css" />
</head>
<body>
  <header class="head">
    <div class="brand">FuzzyCAD</div>
    <div class="sub">Needs Input · open range</div>
  </header>

  <section class="composer">
    <p class="lead">
      Mark a rotation angle as <b>not decided yet</b> — an open range. The
      viewport shows the body ghosted at both ends of the range; a collaborator
      resolves it later.
    </p>

    <label class="field">
      <span class="field__label">Label</span>
      <input id="label" type="text" placeholder="e.g. hinge angle" />
    </label>

    <span class="field__label">Rotation axis</span>
    <div class="axes" role="radiogroup" aria-label="Rotation axis">
      <button class="axis" data-axis="X">X</button>
      <button class="axis" data-axis="Y">Y</button>
      <button class="axis is-active" data-axis="Z">Z</button>
    </div>

    <div class="range">
      <label class="field field--half">
        <span class="field__label">Min °</span>
        <input id="min" type="number" value="-30" step="5" />
      </label>
      <label class="field field--half">
        <span class="field__label">Max °</span>
        <input id="max" type="number" value="30" step="5" />
      </label>
    </div>

    <button id="add" class="add">+ Add open range at selection</button>
    <p class="hint">Select a body (or a face of one) in the model first.</p>
  </section>

  <section class="list">
    <div class="list__head">Marks <span id="count" class="count">0</span></div>
    <ul id="marks" class="marks"></ul>
    <p id="empty" class="empty">No marks yet.</p>
  </section>

  <script src="palette.js"></script>
</body>
</html>
