<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FuzzyCAD</title>
  <link rel="stylesheet" href="palette.css" />
</head>
<body>
  <header class="head">
    <div class="brand">FuzzyCAD</div>
    <div class="sub">open questions · resolve asynchronously</div>
  </header>

  <section class="tools">
    <span class="tools__label">Add a fuzzy op — then drag on the model:</span>
    <div class="tools__row">
      <button class="tool" data-tool="move"><span>⇄</span>Move</button>
      <button class="tool" data-tool="rotate"><span>↻</span>Rotate</button>
      <button class="tool" data-tool="extrude"><span>⤒</span>Extrude</button>
      <button class="tool" data-tool="fillet"><span>◜</span>Fillet</button>
    </div>
  </section>

  <section class="list">
    <div class="list__head">
      <span id="openCount" class="chip chip--open">0 open</span>
      <span id="doneCount" class="chip chip--done">0 decided</span>
    </div>
    <ul id="marks" class="marks"></ul>
    <p id="empty" class="empty">
      No open questions yet.<br />
      Pick a tool above, select geometry, and drag to propose an operation.
    </p>
  </section>

  <script src="palette.js"></script>
</body>
</html>
