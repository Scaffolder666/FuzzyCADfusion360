<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FuzzyCAD</title>
  <link rel="stylesheet" href="palette.css" />
  <link rel="stylesheet" href="hardening.css" />
</head>
<body>
  <header class="head">
    <div class="brand">FuzzyCAD</div>
    <div class="sub">Need Input · Mark Constraint · Conflict</div>
  </header>

  <section class="list">
    <div class="list__head" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span id="count" class="chip">0 open questions</span>
      <button id="clearAll" type="button"
        title="Delete every FuzzyCAD question stored in this document"
        style="display:none;border:1px solid #e2b6b0;color:#d92f1c;background:#fff;font:600 11px/1 -apple-system,'Segoe UI',Roboto,sans-serif;padding:5px 9px;border-radius:6px;cursor:pointer;flex:none">Clear all</button>
    </div>
    <ul id="marks" class="marks"></ul>
    <p id="empty" class="empty">
      No open questions yet.<br />
      Use Need Input for geometry changes, Mark Constraint for notes, or Compare
      when two requirements conflict.
    </p>
  </section>

  <script src="palette.js"></script>
  <script src="panel_incremental.js"></script>
  <script src="panel_resync.js"></script>
  <script src="hover_ops.js"></script>
</body>
</html>
