<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FuzzyCAD Tools</title>
  <style>
    :root {
      --navy: #21313f; --line: #e2e5ea; --bg: #f5f6f8; --muted: #7b8794; --text: #21313f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); }
    .bar { display: flex; align-items: stretch; height: 100%; padding: 8px 10px; gap: 12px; }
    .group { display: flex; flex-direction: column; gap: 4px; }
    .group__label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.6px; color: var(--muted);
      text-transform: uppercase;
    }
    .group__row { display: flex; gap: 6px; }
    .sep { width: 1px; background: var(--line); margin: 2px 0; }
    .tool {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; min-width: 58px; padding: 6px 7px; border: 1px solid var(--line);
      border-radius: 7px; background: #fff; cursor: pointer; color: var(--text);
    }
    .tool span { font-size: 18px; line-height: 1; }
    .tool small { font-size: 9.5px; font-weight: 600; white-space: nowrap; }
    .tool:hover { border-color: var(--navy); }
    .tool:active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .tool--wide { min-width: 74px; }
    .tool--soon { opacity: 0.45; cursor: default; }
    .tool--soon:hover { border-color: var(--line); }
  </style>
</head>
<body>
  <div class="bar">
    <div class="group">
      <span class="group__label">Need Input</span>
      <div class="group__row">
        <button class="tool tool--wide" data-tool="transform" title="Select a body, then drag Move or Rotate handles">
          <span>✥</span><small>Move / Rotate</small></button>
        <button class="tool" data-tool="scale" title="Select a body, then drag one corner handle to scale the whole body">
          <span>⤢</span><small>Scale All</small></button>
        <button class="tool tool--wide" data-tool="directional_scale" title="Select a body, then drag X, Y, or Z to scale only that axis">
          <span>⇥</span><small>Scale X/Y/Z</small></button>
        <button class="tool tool--wide" data-tool="axis_rotate" title="Select the body first; FuzzyCAD automatically advances to selecting a circular edge as the axis">
          <span>↻</span><small>Axis Rotate</small></button>
        <button class="tool" data-tool="extrude"><span>⤒</span><small>Extrude</small></button>
        <button class="tool" data-tool="fillet"><span>◜</span><small>Fillet</small></button>
      </div>
    </div>

    <div class="sep"></div>

    <div class="group">
      <span class="group__label">Mark Constraint</span>
      <div class="group__row">
        <button class="tool tool--wide" data-tool="note" title="Attach a constraint note to geometry">
          <span>◈</span><small>Note</small></button>
      </div>
    </div>

    <div class="sep"></div>

    <div class="group">
      <span class="group__label">Conflict</span>
      <div class="group__row">
        <button class="tool tool--wide tool--soon" title="Compare conflicting alternatives — coming next">
          <span>⑂</span><small>Compare</small></button>
      </div>
    </div>
  </div>

  <script>
    function send(action, data) {
      if (window.adsk && typeof window.adsk.fusionSendData === "function") {
        return window.adsk.fusionSendData(action, JSON.stringify(data || {}));
      }
      console.log("[FuzzyCAD toolbar]", action, data);
      return Promise.resolve("{}");
    }
    window.fusionJavaScriptHandler = { handle: function () { return "{}"; } };
    document.addEventListener("DOMContentLoaded", function () {
      var tools = document.querySelectorAll(".tool[data-tool]");
      Array.prototype.forEach.call(tools, function (btn) {
        btn.addEventListener("click", function () {
          send("tool", { tool: btn.getAttribute("data-tool") });
        });
      });
    });
  </script>
</body>
</html>
