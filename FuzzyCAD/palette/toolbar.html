<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FuzzyCAD Tools</title>
  <style>
    :root {
      --navy:#21313f; --line:#e2e5ea; --bg:#f5f6f8; --muted:#7b8794;
      --text:#21313f; --orange:#e17e26; --green:#2ea043;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
    .rail{display:flex;flex-direction:column;height:100%;padding:10px 9px;gap:11px;overflow:auto}
    .brand{font-size:12px;font-weight:800;letter-spacing:.3px;padding:0 2px}
    .stage{display:none;background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:9px;padding:9px 9px 8px;box-shadow:0 4px 14px rgba(20,31,43,.08)}
    .stage.visible{display:block}
    .stage__title{font-size:11px;font-weight:800;margin-bottom:7px}
    .stage__step{display:flex;align-items:flex-start;gap:7px;font-size:10.5px;line-height:1.25;color:var(--muted);padding:4px 0}
    .stage__step.active{color:var(--navy);font-weight:750}
    .stage__step.done{color:#63717d}
    .dot{flex:0 0 15px;height:15px;border:1px solid #cbd2d8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;margin-top:-1px;background:#fff}
    .stage__step.active .dot{border-color:var(--orange);box-shadow:inset 0 0 0 3px #fff;background:var(--orange)}
    .stage__step.done .dot{border-color:var(--green);background:var(--green);color:#fff}
    .hint{display:block;font-size:9px;font-weight:500;color:#9aa4ad;margin-top:1px}
    .decision{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
    .decision.visible{display:block}
    .decision__title{font-size:10.5px;font-weight:800;margin-bottom:2px}
    .decision__message{font-size:9.5px;line-height:1.25;color:var(--muted);margin-bottom:7px}
    .decision__options{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:5px}
    .decision__option{min-height:38px;padding:5px 4px;border:1px solid #d9dee4;border-radius:7px;background:#fff;color:var(--text);font-size:9.5px;font-weight:700;cursor:pointer}
    .decision__option:hover{border-color:var(--orange)}
    .decision__option.selected{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange);color:#a75612;background:#fffaf5}
    .decision__glyph{display:block;font-size:14px;line-height:1;margin-bottom:3px}
    .stage__confirm{width:100%;margin-top:8px;padding:6px 8px;border:1px solid var(--navy);border-radius:6px;background:#fff;color:var(--navy);font-size:10.5px;font-weight:750;cursor:pointer}
    .stage__confirm:hover{background:#f2f5f7}.stage__confirm:active{background:var(--navy);color:#fff}
    .group{display:flex;flex-direction:column;gap:5px}
    .group__label{font-size:9px;font-weight:800;letter-spacing:.65px;color:var(--muted);text-transform:uppercase;padding:0 2px}
    .group__grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:7px 5px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;color:var(--text)}
    .tool span{font-size:18px;line-height:1}.tool small{font-size:9.5px;font-weight:650;line-height:1.15;text-align:center}
    .tool__icon-img{width:29px;height:29px;display:block;object-fit:contain}
    .tool:hover{border-color:var(--navy)}.tool:active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .tool:active .tool__icon-img{filter:invert(1)}
    .tool--wide{grid-column:span 2}.tool--soon{opacity:.42;cursor:default}.tool--soon:hover{border-color:var(--line)}
    .sep{height:1px;background:var(--line);margin:0 1px}
    .depbar{display:flex;flex-direction:column;gap:6px}
    .depbar:empty{display:none}
    .depbar__item{display:flex;align-items:flex-start;gap:7px;background:#fffaf5;border:1px solid #f0d3b6;border-left:4px solid var(--orange);border-radius:8px;padding:8px 9px;box-shadow:0 3px 10px rgba(20,31,43,.06)}
    .depbar__body{flex:1;min-width:0}
    .depbar__title{font-size:9.5px;font-weight:800;color:#a75612;letter-spacing:.4px;margin-bottom:2px}
    .depbar__text{font-size:10px;line-height:1.3;color:var(--text)}
    .depbar__x{flex:none;border:1px solid #e6c6a6;background:#fff;color:#a75612;font-size:9.5px;font-weight:700;border-radius:6px;padding:4px 7px;cursor:pointer;line-height:1}
    .depbar__x:hover{background:var(--orange);color:#fff;border-color:var(--orange)}
  </style>
</head>
<body>
  <div class="rail">
    <div class="brand">FuzzyCAD</div>

    <div id="depBanner" class="depbar"></div>

    <div id="stage" class="stage">
      <div id="stageTitle" class="stage__title"></div>
      <div id="stageSteps"></div>
      <div id="decision" class="decision">
        <div id="decisionTitle" class="decision__title"></div>
        <div id="decisionMessage" class="decision__message"></div>
        <div id="decisionOptions" class="decision__options"></div>
      </div>
      <button id="stageConfirm" class="stage__confirm" type="button">Confirm</button>
    </div>

    <div class="group">
      <span class="group__label">Need Input</span>
      <div class="group__grid">
        <button class="tool tool--wide" data-tool="transform" title="Select a body, then drag Move or Rotate handles">
          <span>✥</span><small>Move / Rotate</small></button>
        <button class="tool" data-tool="scale" title="Select a body, then drag the corner handle">
          <span>⤢</span><small>Scale All</small></button>
        <button class="tool" data-tool="directional_scale" title="Select a body, choose a direction, then drag">
          <span>⇥</span><small>Scale X/Y/Z</small></button>
        <button class="tool tool--wide" data-tool="axis_rotate" title="Select body, select a circular edge, then drag the ring">
          <span>↻</span><small>Axis Rotate</small></button>
        <button class="tool" data-tool="extrude"><span>⤒</span><small>Extrude</small></button>
        <button class="tool" data-tool="fillet"><span>◜</span><small>Fillet</small></button>
      </div>
    </div>

    <div class="sep"></div>

    <div class="group">
      <span class="group__label">Mark Constraint</span>
      <div class="group__grid">
        <button class="tool tool--wide" data-tool="note" title="Attach a constraint note to geometry">
          <span>◈</span><small>Note</small></button>
      </div>
    </div>

    <div class="sep"></div>

    <div class="group">
      <span class="group__label">Conflict</span>
      <div class="group__grid">
        <button class="tool tool--wide" data-tool="compare" title="Compare two alternative bodies at one target location">
          <img class="tool__icon-img" src="conflict_icon.svg" alt="Conflict" /><small>Compare</small></button>
      </div>
    </div>
  </div>

  <script>
  (function(){
    "use strict";
    var activeStage=null;
    var activeDecision=null;

    function send(action,data){
      if(window.adsk&&typeof window.adsk.fusionSendData==="function"){
        return window.adsk.fusionSendData(action,JSON.stringify(data||{}));
      }
      return Promise.resolve("{}");
    }

    function updateStageShell(){
      var box=document.getElementById("stage");
      var hasStage=!!(activeStage&&activeStage.tool&&(activeStage.steps||[]).length);
      var hasDecision=!!(activeDecision&&activeDecision.kind);
      box.classList.toggle("visible",hasStage||hasDecision);
      document.getElementById("stageTitle").textContent=hasStage?(activeStage.title||"Next"):(hasDecision?"Decision":"");
      var confirm=document.getElementById("stageConfirm");
      confirm.textContent=hasDecision?"Confirm choice":"Confirm";
    }

    function renderStage(data){
      var steps=(data&&data.steps)||[];
      activeStage=(data&&data.tool&&steps.length)?data:null;
      var wrap=document.getElementById("stageSteps");wrap.innerHTML="";
      if(activeStage){
        steps.forEach(function(step,i){
          var row=document.createElement("div");
          row.className="stage__step"+(step.done?" done":"")+(i===data.active?" active":"");
          var dot=document.createElement("span");dot.className="dot";dot.textContent=step.done?"✓":String(i+1);
          var text=document.createElement("span");text.textContent=step.label||"";
          if(step.hint){var hint=document.createElement("span");hint.className="hint";hint.textContent=step.hint;text.appendChild(hint);}
          row.appendChild(dot);row.appendChild(text);wrap.appendChild(row);
        });
      }
      updateStageShell();
    }

    function renderDecision(data){
      activeDecision=(data&&data.kind)?data:null;
      var box=document.getElementById("decision");
      var options=document.getElementById("decisionOptions");
      options.innerHTML="";
      if(!activeDecision){
        box.classList.remove("visible");
        document.getElementById("decisionTitle").textContent="";
        document.getElementById("decisionMessage").textContent="";
        updateStageShell();
        return;
      }
      document.getElementById("decisionTitle").textContent=activeDecision.title||"Choose";
      document.getElementById("decisionMessage").textContent=activeDecision.message||"";
      (activeDecision.options||[]).forEach(function(opt){
        var b=document.createElement("button");
        b.type="button";
        b.className="decision__option"+(activeDecision.selected===opt.value?" selected":"");
        var glyph=document.createElement("span");glyph.className="decision__glyph";glyph.textContent=opt.glyph||"";
        var label=document.createElement("span");label.textContent=opt.label||opt.value||"";
        b.appendChild(glyph);b.appendChild(label);
        b.addEventListener("click",function(){
          activeDecision.selected=opt.value;
          renderDecision(activeDecision);
          send("decision_choice",{kind:activeDecision.kind,value:opt.value});
        });
        options.appendChild(b);
      });
      box.classList.add("visible");
      updateStageShell();
    }

    function renderDepPrompt(data){
      var wrap=document.getElementById("depBanner");
      if(!wrap)return;
      wrap.innerHTML="";
      var prompts=(data&&data.prompts)||[];
      prompts.forEach(function(pr){
        var item=document.createElement("div");item.className="depbar__item";
        var body=document.createElement("div");body.className="depbar__body";
        var title=document.createElement("div");title.className="depbar__title";
        title.textContent=pr.kind==="reach"?"REACH CHECK":"FIT CHECK";
        var text=document.createElement("div");text.className="depbar__text";text.textContent=pr.text||"";
        body.appendChild(title);body.appendChild(text);
        var x=document.createElement("button");x.type="button";x.className="depbar__x";x.textContent="Dismiss";
        x.addEventListener("click",function(){send("dismissDep",{id:pr.id});});
        item.appendChild(body);item.appendChild(x);
        wrap.appendChild(item);
      });
    }

    window.fusionJavaScriptHandler={handle:function(action,dataString){
      try{
        var data=dataString?JSON.parse(dataString):{};
        if(action==="stage")renderStage(data);
        else if(action==="decision_prompt")renderDecision(data);
        else if(action==="depPrompt")renderDepPrompt(data);
      }catch(e){return JSON.stringify({ok:false,error:String(e)});}
      return JSON.stringify({ok:true});
    }};

    document.addEventListener("DOMContentLoaded",function(){
      var tools=document.querySelectorAll(".tool[data-tool]");
      Array.prototype.forEach.call(tools,function(btn){
        btn.addEventListener("click",function(){send("tool",{tool:btn.getAttribute("data-tool")});});
      });
      var confirm=document.getElementById("stageConfirm");
      if(confirm){confirm.addEventListener("click",function(){
        if(activeDecision&&activeDecision.kind){
          send("decision_confirm",{kind:activeDecision.kind,value:activeDecision.selected});
        }else{
          send("confirm",{});
        }
      });}
    });
  })();
  </script>
</body>
</html>
